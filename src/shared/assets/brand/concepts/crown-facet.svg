<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="title desc" data-camm-aperture="true">
  <title id="title">Crown Facet</title>
  <desc id="desc">The current Camm aperture with a faceted outer crystal crown and a smooth inner void.</desc>
  <style>
    .facet-light { animation: facet-light 7.2s ease-in-out infinite; }
    @keyframes facet-light { 0%,18%,76%,100% { opacity: .12; } 38%,54% { opacity: .72; } }
    @media (prefers-reduced-motion: reduce) { .facet-light { animation: none; } }
  </style>
  <defs>
    <linearGradient id="facet-face" x1="7" y1="4" x2="56" y2="59" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff" stop-opacity=".96"/><stop offset=".24" stop-color="#7b8792" stop-opacity=".18"/><stop offset=".48" stop-color="#ffffff" stop-opacity=".7"/><stop offset=".75" stop-color="#34414d" stop-opacity=".16"/><stop offset="1" stop-color="#ffffff" stop-opacity=".74"/></linearGradient>
    <linearGradient id="facet-edge" x1="8" y1="5" x2="55" y2="58" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset=".3" stop-color="#65727e"/><stop offset=".56" stop-color="#ffffff"/><stop offset="1" stop-color="#303d48"/></linearGradient>
    <clipPath id="facet-clip"><path d="M51 16L43 23A15 15 0 1 0 43 41L51 48A25 25 0 1 1 51 16Z"/></clipPath>
    <filter id="facet-shadow" x="-35%" y="-30%" width="180%" height="190%"><feDropShadow dx="1" dy="5" stdDeviation="3" flood-color="#15202a" flood-opacity=".22"/></filter>
  </defs>
  <ellipse cx="160" cy="210" rx="76" ry="10" fill="#25313c" opacity=".1"/>
  <ellipse cx="160" cy="203" rx="48" ry="5" fill="#ffffff" opacity=".56"/>
  <g class="facet-body" transform="translate(64 24) scale(3)" filter="url(#facet-shadow)">
    <path d="M51 16L43 23A15 15 0 1 0 43 41L51 48A25 25 0 1 1 51 16Z" fill="#3b4854" opacity=".16" transform="translate(1.7 2.2)"/>
    <path d="M51 16L43 23A15 15 0 1 0 43 41L51 48A25 25 0 1 1 51 16Z" fill="url(#facet-face)" stroke="url(#facet-edge)" stroke-width=".72"/>
    <g clip-path="url(#facet-clip)">
      <polygon points="3,17 12,7 17,22 8,29" fill="#ffffff" opacity=".25"/>
      <polygon points="12,7 24,2 25,20 17,22" fill="#56636f" opacity=".11"/>
      <polygon points="24,2 36,2 33,21 25,20" fill="#ffffff" opacity=".28"/>
      <polygon points="36,2 48,8 41,24 33,21" fill="#40505c" opacity=".1"/>
      <polygon points="3,17 8,29 7,42 2,47" fill="#ffffff" opacity=".18"/>
      <polygon points="2,47 10,56 18,43 7,42" fill="#485661" opacity=".09"/>
      <polygon points="10,56 24,62 25,43 18,43" fill="#ffffff" opacity=".24"/>
      <polygon points="24,62 38,59 34,42 25,43" fill="#3f4c58" opacity=".1"/>
      <polygon class="facet-light" points="38,59 51,48 43,41 34,42" fill="#ffffff" opacity=".7"/>
      <path d="M18 4L21 18M7 25L16 27M8 43L17 40M25 59L27 47M39 6L36 20" fill="none" stroke="#ffffff" stroke-width=".42" opacity=".62"/>
      <path d="M5 17L17 22 25 20 33 21 42 24M4 47L17 43 25 43 34 42 43 40" fill="none" stroke="#34414c" stroke-width=".28" opacity=".32"/>
    </g>
    <path d="M51 16L43 23M43 41L51 48" fill="none" stroke="#ffffff" stroke-width=".72" stroke-linecap="round" opacity=".72"/>
    <path d="M16 11A25 25 0 0 0 6.8 28" fill="none" stroke="#ffffff" stroke-width="1.05" stroke-linecap="round" opacity=".68"/>
  </g>
</svg>
