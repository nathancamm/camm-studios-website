<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="title desc" data-camm-aperture="true">
  <title id="title">Prism Terminals</title>
  <desc id="desc">The current Camm aperture cut from clear crystal with deeper diagonal terminal prisms.</desc>
  <style>
    .optical-sweep { animation: optical-sweep 5.8s cubic-bezier(.32,.72,0,1) infinite; }
    .terminal-top { animation: terminal-top 5.8s cubic-bezier(.32,.72,0,1) infinite; transform-origin: 49px 19px; }
    .terminal-bottom { animation: terminal-bottom 5.8s cubic-bezier(.32,.72,0,1) infinite; transform-origin: 49px 45px; }
    @keyframes optical-sweep { 0%,18% { transform: translateX(-38px); opacity: 0; } 28%,52% { opacity: .82; } 68%,100% { transform: translateX(64px); opacity: 0; } }
    @keyframes terminal-top { 0%,14% { transform: rotate(-3deg); } 32%,100% { transform: rotate(0); } }
    @keyframes terminal-bottom { 0%,14% { transform: rotate(3deg); } 32%,100% { transform: rotate(0); } }
    @media (prefers-reduced-motion: reduce) { .optical-sweep, .terminal-top, .terminal-bottom { animation: none; } }
  </style>
  <defs>
    <linearGradient id="prism-face" x1="10" y1="5" x2="55" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".96"/><stop offset=".2" stop-color="#9faab5" stop-opacity=".22"/><stop offset=".46" stop-color="#ffffff" stop-opacity=".68"/><stop offset=".72" stop-color="#44515d" stop-opacity=".18"/><stop offset="1" stop-color="#ffffff" stop-opacity=".76"/>
    </linearGradient>
    <linearGradient id="prism-edge" x1="8" y1="8" x2="52" y2="55" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/><stop offset=".28" stop-color="#56636f"/><stop offset=".55" stop-color="#ffffff"/><stop offset="1" stop-color="#313d48"/>
    </linearGradient>
    <linearGradient id="terminal-glass" x1="42" y1="15" x2="53" y2="49" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".92"/><stop offset=".45" stop-color="#697581" stop-opacity=".34"/><stop offset="1" stop-color="#ffffff" stop-opacity=".64"/>
    </linearGradient>
    <clipPath id="prism-clip"><path d="M51 16L43 23A15 15 0 1 0 43 41L51 48A25 25 0 1 1 51 16Z"/></clipPath>
    <filter id="prism-shadow" x="-35%" y="-30%" width="180%" height="190%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.8" result="blur"/><feOffset in="blur" dx="1" dy="5" result="offset"/><feColorMatrix in="offset" values="0 0 0 0 .08 0 0 0 0 .12 0 0 0 0 .16 0 0 0 .22 0" result="shadow"/><feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <ellipse cx="160" cy="210" rx="75" ry="10" fill="#26323d" opacity=".11"/>
  <ellipse cx="160" cy="204" rx="50" ry="5" fill="#ffffff" opacity=".62"/>
  <g transform="translate(64 24) scale(3)" filter="url(#prism-shadow)">
    <path d="M51 16L43 23A15 15 0 1 0 43 41L51 48A25 25 0 1 1 51 16Z" fill="#4d5964" opacity=".18" transform="translate(1.7 2.2)"/>
    <path d="M51 16L43 23A15 15 0 1 0 43 41L51 48A25 25 0 1 1 51 16Z" fill="url(#prism-face)" stroke="url(#prism-edge)" stroke-width=".7"/>
    <g clip-path="url(#prism-clip)">
      <path d="M1 4L28 4 17 60-4 60Z" fill="#ffffff" opacity=".22"/>
      <path d="M19 3L29 3 21 61 12 61Z" fill="#1f2b36" opacity=".08"/>
      <path d="M29 2L39 2 30 62 23 62Z" fill="#ffffff" opacity=".3"/>
      <path d="M39 3L56 3 46 61 35 61Z" fill="#52606c" opacity=".08"/>
      <rect class="optical-sweep" x="-22" y="-10" width="8" height="84" rx="4" fill="#ffffff" opacity=".74" transform="rotate(18 0 32)"/>
    </g>
    <g class="terminal-top">
      <path d="M51 16L43 23 47.2 24.1 53.1 18.2Z" fill="#36424e" opacity=".2"/>
      <path d="M51 16L43 23 47.2 24.1 53.1 18.2Z" fill="url(#terminal-glass)" stroke="#ffffff" stroke-width=".38"/>
      <path d="M51 16L43 23" fill="none" stroke="#ffffff" stroke-width=".8" stroke-linecap="round" opacity=".86"/>
    </g>
    <g class="terminal-bottom">
      <path d="M43 41L51 48 53.1 45.8 47.2 39.9Z" fill="#33404b" opacity=".2"/>
      <path d="M43 41L51 48 53.1 45.8 47.2 39.9Z" fill="url(#terminal-glass)" stroke="#ffffff" stroke-width=".38"/>
      <path d="M43 41L51 48" fill="none" stroke="#ffffff" stroke-width=".8" stroke-linecap="round" opacity=".76"/>
    </g>
    <path d="M20 9.4A25 25 0 0 0 7.2 25" fill="none" stroke="#ffffff" stroke-width="1.15" stroke-linecap="round" opacity=".72"/>
    <path d="M9.2 43A25 25 0 0 0 25.5 56" fill="none" stroke="#46535e" stroke-width=".36" stroke-linecap="round" opacity=".62"/>
  </g>
</svg>
