<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="title desc">
  <title id="title">Crystal Bracket</title>
  <desc id="desc">Three faceted clear crystal prisms arranged as an angular C.</desc>
  <defs>
    <linearGradient id="bracket-face" x1="65" y1="48" x2="238" y2="199" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".88"/>
      <stop offset=".48" stop-color="#d9dfe5" stop-opacity=".38"/>
      <stop offset="1" stop-color="#77828d" stop-opacity=".34"/>
    </linearGradient>
    <linearGradient id="bracket-side" x1="88" y1="48" x2="214" y2="208" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c8cfd7" stop-opacity=".5"/>
      <stop offset="1" stop-color="#555f6a" stop-opacity=".4"/>
    </linearGradient>
    <filter id="bracket-shadow" x="35" y="10" width="255" height="230" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="11" flood-color="#1b222b" flood-opacity=".2"/>
    </filter>
  </defs>
  <g filter="url(#bracket-shadow)" stroke-linejoin="round">
    <path d="M78 43H229L211 82H99Z" fill="url(#bracket-face)" stroke="#ffffff" stroke-opacity=".72"/>
    <path d="M78 43L99 82V166L78 197L61 178V62Z" fill="url(#bracket-face)" stroke="#7c8792" stroke-opacity=".5"/>
    <path d="M99 166H211L234 201H78Z" fill="url(#bracket-face)" stroke="#ffffff" stroke-opacity=".66"/>
    <path d="M229 43L211 82H99L109 70H205Z" fill="url(#bracket-side)"/>
    <path d="M99 82V166L78 197V84Z" fill="url(#bracket-side)"/>
    <path d="M99 166H211L234 201L211 184H88Z" fill="url(#bracket-side)"/>
    <path d="M76 51H215" fill="none" stroke="#ffffff" stroke-opacity=".84" stroke-width="3" stroke-linecap="round"/>
    <path d="M69 67V170" fill="none" stroke="#ffffff" stroke-opacity=".62" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
