<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="title desc">
  <title id="title">Glass Cable</title>
  <desc id="desc">A continuous rounded clear crystal arc with polished terminals.</desc>
  <defs>
    <linearGradient id="cable-body" x1="58" y1="35" x2="239" y2="203" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".96"/>
      <stop offset=".28" stop-color="#cfd6de" stop-opacity=".38"/>
      <stop offset=".57" stop-color="#ffffff" stop-opacity=".66"/>
      <stop offset="1" stop-color="#697480" stop-opacity=".42"/>
    </linearGradient>
    <radialGradient id="cable-cap" cx="0" cy="0" r="1" gradientTransform="translate(221 55) rotate(129) scale(27)">
      <stop stop-color="#ffffff" stop-opacity=".96"/>
      <stop offset=".46" stop-color="#d5dbe2" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6d7782" stop-opacity=".42"/>
    </radialGradient>
    <filter id="cable-shadow" x="24" y="2" width="276" height="252" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#1b222b" flood-opacity=".2"/>
    </filter>
  </defs>
  <g filter="url(#cable-shadow)">
    <path d="M222 55A84 84 0 1 0 222 185" fill="none" stroke="#636e79" stroke-opacity=".22" stroke-width="34" stroke-linecap="round" transform="translate(0 7)"/>
    <path d="M222 48A84 84 0 1 0 222 192" fill="none" stroke="url(#cable-body)" stroke-width="34" stroke-linecap="round"/>
    <path d="M215 38A84 84 0 0 0 75 96" fill="none" stroke="#ffffff" stroke-opacity=".84" stroke-width="4" stroke-linecap="round"/>
    <circle cx="222" cy="48" r="17" fill="url(#cable-cap)" stroke="#ffffff" stroke-opacity=".7"/>
    <circle cx="222" cy="192" r="17" fill="url(#cable-cap)" stroke="#69737e" stroke-opacity=".45"/>
    <circle cx="216" cy="42" r="5" fill="#ffffff" fill-opacity=".72"/>
    <circle cx="216" cy="186" r="5" fill="#ffffff" fill-opacity=".58"/>
  </g>
</svg>
